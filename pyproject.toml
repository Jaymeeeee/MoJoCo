[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-workspace"
version = "0.1.0"
description = "Shared MuJoCo workspace with reusable tools and independent simulation examples"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "PyYAML>=6",
  "h5py>=3.10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "Pillow>=10",
  "trimesh>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
insert-plug = "examples.insert_plug.cli:main"
mujoco-doctor = "mujoco_tools.doctor:main"

[tool.setuptools]
packages = ["mujoco_tools", "examples", "examples.insert_plug"]

[tool.setuptools.package-dir]
"" = "src"
examples = "examples"
"examples.insert_plug" = "examples/insert_plug"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
