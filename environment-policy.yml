# Compatibility filename: use the same shared environment as environment.yml.
name: mujoco
variables:
  PYTHONPATH: ""
  PYTHONNOUSERSITE: "1"
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - ffmpeg=7
# scripts/setup_mujoco_env.sh installs the shared simulation, training and
# inference dependencies from requirements-lock.txt, then the local packages.
